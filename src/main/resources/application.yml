spring:
  application:
    name: online-store-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/online_store}
    username: ${DB_USERNAME:online_store}
    password: ${DB_PASSWORD:online_store}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.store: INFO
