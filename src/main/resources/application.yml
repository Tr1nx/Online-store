spring:
  application:
    name: online-store-api
  datasource:
    url: jdbc:postgresql://localhost:5432/online_store
    username: online_store
    password: ${DB_PASSWORD:online_store}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    changelog: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    com.store: INFO
